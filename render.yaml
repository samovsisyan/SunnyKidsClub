services:
  - type: web
    name: sunny-kids-club
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm run db:deploy -w server
    startCommand: npm start
    healthCheckPath: /robots.txt
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sunny-kids-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORAGE_DRIVER
        value: local

databases:
  - name: sunny-kids-db
    databaseName: sunnykids
    plan: free
