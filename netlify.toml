[build]
  command = "npm run build:netlify"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", ".prisma", "sharp", "@img/sharp-linux-x64", "@img/sharp-libvips-linux-x64"]
  included_files = ["node_modules/.prisma/client/**"]

# /api/*, /media/*, /sitemap.xml and /robots.txt are routed to the function via its `config.path`.

# React SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5180
  framework = "#custom"
